name: release-artifacts

# Builds the sdist + wheel from the tagged source and attaches them to the GitHub
# release, plus the end-to-end accuracy report produced by the gate when it is
# present in the repository (it is normally a local artefact and is skipped).
#
# The asset upload has to run on a GitHub runner: `uploads.github.com` is not
# reachable from every environment that can push a tag.

on:
  push:
    branches: ["arena/01a10ae3-software"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One run at a time.  A tag push and a branch push now happen together, and two
# runs uploading to the same release with `--clobber` delete each other's assets
# (the delete/upload pair is not atomic), so they are serialised instead.
concurrency:
  group: release-artifacts
  cancel-in-progress: false

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet --upgrade build
          python -m build --outdir dist

      - name: Sanity-check the wheel installs and reports its version
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          /tmp/venv/bin/recon3d --version
          /tmp/venv/bin/recon3d doctor --json | /tmp/venv/bin/python -c "import json,sys; d=json.load(sys.stdin); print('doctor ok:', d.get('version') or d.get('ok'))"

      - name: Attach artefacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release view "$TAG" --json assets --jq '[.assets[].name]'
          else
            echo "no release for $TAG yet; uploading as workflow artefact"
            exit 0
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: recon3d-dist
          path: dist/*

  # Runs the accuracy gate on the tagged source and attaches the *measured*
  # report to the release, so a released version ships machine-checkable
  # accuracy evidence instead of a claim. The report is produced by
  # scripts/e2e_check.py from a freshly generated reference set - the same
  # fixture that developers run locally.
  e2e-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the engine
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e ".[all]"

      - name: Generate the reference set
        run: python scripts/make_demo_dataset.py --out ./refs --views 9 --masks

      - name: Run the end-to-end accuracy gate
        id: gate
        continue-on-error: true
        run: >-
          python scripts/e2e_check.py --preset standard --views 9
          --resolution 384 --texture-resolution 1024 --min-iou 0.55 --keep
          | tee gate.log
        # --keep is required: without it the gate deletes its work directory on
        # success, which is exactly where the report this job attaches lives.

      - name: Publish the measured report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          test -f .e2e/e2e-standard.json || {
            echo "::error::the gate produced no report"; tail -40 gate.log || true; exit 1; }
          python -c "import json;d=json.load(open('.e2e/e2e-standard.json'));print('gate report:', json.dumps({k:d.get(k) for k in ('preset','duration_s','quality','metrics','ok','result')})[:2000])"
          cp .e2e/e2e-standard.json "recon3d-e2e-report-${TAG}.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "recon3d-e2e-report-${TAG}.json" --clobber
            gh release view "$TAG" --json assets --jq '[.assets[].name]'
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recon3d-e2e-report
          path: .e2e/e2e-standard.json
          if-no-files-found: warn

      - name: Fail the job when the gate failed
        if: steps.gate.outcome == 'failure'
        run: exit 1
